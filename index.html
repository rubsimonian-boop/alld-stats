<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#121211">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alld Stats">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>Alld Stats</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f3f0; --surface: #fcfcfb; --surface-2: #efeee9; --line: #e2e1dc;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #85847e;
  --pos: #2a78d6; --neg: #e34948; --mid: #f0efec;
  --pos-soft: rgba(42,120,214,.14); --neg-soft: rgba(227,73,72,.14);
  --accent: #2a78d6; --good: #006300; --bad: #d03b3b;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --line: #2e2e2b;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #8d8c84;
    --pos: #3987e5; --neg: #e66767; --mid: #383835;
    --pos-soft: rgba(57,135,229,.18); --neg-soft: rgba(230,103,103,.18);
    --accent: #3987e5; --good: #0ca30c; --bad: #e66767;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --line: #2e2e2b;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #8d8c84;
  --pos: #3987e5; --neg: #e66767; --mid: #383835;
  --pos-soft: rgba(57,135,229,.18); --neg-soft: rgba(230,103,103,.18);
  --accent: #3987e5; --good: #0ca30c; --bad: #e66767;
  --shadow: none;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); touch-action: pan-x pan-y; -webkit-text-size-adjust: 100%; }
body {
  font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  font-variant-numeric: tabular-nums; min-height: 100vh;
  padding-bottom: calc(72px + env(safe-area-inset-bottom));
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
input, textarea { font: inherit; color: inherit; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
.hidden { display: none !important; }

/* header */
header {
  position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  padding-top: env(safe-area-inset-top); border-bottom: 1px solid var(--line);
}
.hrow { display: flex; align-items: center; gap: 8px; height: 48px; }
.title { font-weight: 650; font-size: 17px; flex: 1; letter-spacing: -.01em; }
.icon-btn { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--text-2); }
.icon-btn:active { background: var(--surface-2); }
.icon-btn svg { width: 20px; height: 20px; }
.period { display: flex; align-items: center; gap: 4px; padding-bottom: 8px; }
.seg { display: flex; background: var(--surface-2); border-radius: 10px; padding: 2px; flex: 1; }
.seg button { flex: 1; height: 30px; border-radius: 8px; font-size: 13px; color: var(--text-2); white-space: nowrap; }
.seg button.on { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.nav { display: flex; align-items: center; justify-content: space-between; padding-bottom: 8px; gap: 8px; }
.nav .lbl { font-weight: 600; font-size: 15px; text-align: center; flex: 1; }
.chips { display: flex; gap: 6px; padding-bottom: 10px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { height: 30px; padding: 0 12px; border-radius: 15px; border: 1px solid var(--line); font-size: 13px; color: var(--text-2); white-space: nowrap; flex: none; }
.chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }

/* cards */
main { padding-top: 14px; }
.card { background: var(--surface); border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); border: 1px solid var(--line); }
.card h3 { margin: 0 0 12px; font-size: 13px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; }
.hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.hero .big { font-size: 44px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
.hero .sub { color: var(--text-2); font-size: 14px; margin-top: 6px; }
.pos { color: var(--pos); } .neg { color: var(--neg); } .zero { color: var(--text-2); }
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--line); border-radius: 12px; overflow: hidden; margin-top: 16px; }
@media (min-width: 560px) { .tiles { grid-template-columns: repeat(4, 1fr); } }
.tile { background: var(--surface); padding: 10px 12px; }
.tile .k { font-size: 12px; color: var(--text-3); }
.tile .v { font-size: 18px; font-weight: 650; margin-top: 2px; }
.empty { color: var(--text-3); text-align: center; padding: 28px 8px; font-size: 14px; }

/* charts */
.chart { position: relative; width: 100%; touch-action: pan-y; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart .axis { fill: var(--text-3); font-size: 11px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .zero-line { stroke: var(--text-3); stroke-width: 1; }
.tip {
  position: absolute; pointer-events: none; background: var(--text); color: var(--bg); border-radius: 8px;
  padding: 6px 9px; font-size: 12px; line-height: 1.35; white-space: nowrap; transform: translate(-50%, -100%);
  opacity: 0; transition: opacity .1s; z-index: 5;
}
.tip.on { opacity: 1; }
.tip b { font-weight: 650; }

/* breakdown rows */
.rows { display: grid; gap: 10px; }
.brow { display: grid; grid-template-columns: 96px 1fr 64px; align-items: center; gap: 10px; font-size: 14px; }
.brow .name { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brow .name small { display: block; color: var(--text-3); font-size: 11px; }
.brow .val { text-align: right; font-weight: 600; }
.track { position: relative; height: 22px; }
.track .mid { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--line); }
.track .bar { position: absolute; top: 3px; height: 16px; border-radius: 4px; }

/* calendar */
.cal { display: grid; grid-template-columns: repeat(7, 1fr) 54px; gap: 4px; }
.cal .dow { font-size: 11px; color: var(--text-3); text-align: center; padding-bottom: 2px; }
.cal .day { aspect-ratio: 1 / 1.05; border-radius: 10px; background: var(--surface-2); padding: 4px; display: flex; flex-direction: column; justify-content: space-between; font-size: 11px; min-width: 0; text-align: left; }
.cal .day.out { opacity: .35; }
.cal .day.sel { outline: 2px solid var(--text); outline-offset: -2px; }
.cal .day .d { color: var(--text-3); }
.cal .day .r { font-weight: 650; font-size: 12px; white-space: nowrap; overflow: hidden; }
.cal .day .n { color: var(--text-3); font-size: 10px; }
.cal .wk { display: flex; flex-direction: column; justify-content: center; align-items: flex-end; font-size: 12px; font-weight: 650; padding-right: 2px; }
.cal .wk small { font-weight: 400; color: var(--text-3); font-size: 10px; }
@media (max-width: 380px) { .cal { grid-template-columns: repeat(7, 1fr) 44px; gap: 3px; } .cal .day .r { font-size: 11px; } }

.pctbox { text-align: right; }
.pctbox .k, .pk { font-size: 12px; color: var(--text-3); }
.pctbox .pv { font-size: 18px; font-weight: 650; margin: 2px 0; }
.pv { font-size: 16px; font-weight: 650; }
.pk { margin-top: 2px; font-weight: 600; }
.pctrow { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 6px; font-size: 15px; }
.pctrow div { display: flex; gap: 6px; align-items: baseline; }
.pctrow .k { color: var(--text-3); font-size: 13px; }
.wstrip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 16px; }
.wd { background: var(--surface-2); border-radius: 10px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; color: var(--text-3); }
.wd b { font-size: 14px; font-weight: 650; }
.wd.now { outline: 2px solid var(--text); outline-offset: -2px; }

/* list */
.group { margin-bottom: 14px; }
.ghead { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-2); padding: 0 4px 6px; font-weight: 600; }
.list { background: var(--surface); border-radius: 14px; border: 1px solid var(--line); overflow: hidden; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; width: 100%; text-align: left; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item:active { background: var(--surface-2); }
.item .main { flex: 1; min-width: 0; }
.item .l1 { font-weight: 600; display: flex; gap: 6px; align-items: center; }
.item .l2 { font-size: 12px; color: var(--text-3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .rv { font-weight: 700; font-size: 16px; text-align: right; }
.item .rv small { display: block; font-size: 11px; font-weight: 400; color: var(--text-3); }
.badge { font-size: 11px; padding: 1px 6px; border-radius: 6px; background: var(--surface-2); color: var(--text-2); font-weight: 500; }
.mk { font-size: 13px; }
.idea-text { font-size: 14px; color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-top: 4px; font-weight: 400; }

/* sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40; opacity: 0; transition: opacity .2s; }
.sheet-bg.on { opacity: 1; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 92vh; overflow-y: auto;
  background: var(--bg); border-radius: 18px 18px 0 0; transform: translateY(100%); transition: transform .25s ease;
  padding-bottom: calc(24px + env(safe-area-inset-bottom)); overscroll-behavior: contain;
}
.sheet.on { transform: none; }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 4px; }
.sheet .shead { display: flex; align-items: center; justify-content: space-between; padding: 6px 0 12px; }
.sheet .shead .t { font-weight: 650; font-size: 17px; }
.kv { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--line); border-radius: 12px; overflow: hidden; }
.kv > div { background: var(--surface); padding: 9px 12px; }
.kv .k { font-size: 12px; color: var(--text-3); }
.kv .v { font-weight: 600; }
.text { white-space: pre-wrap; font-size: 15px; line-height: 1.5; }
.marks { display: flex; gap: 8px; }
.marks button { flex: 1; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; }
.marks button.on.yes { border-color: var(--good); color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--surface)); }
.marks button.on.no { border-color: var(--bad); color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--surface)); }
textarea.note { width: 100%; min-height: 70px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 10px 12px; margin-top: 10px; resize: vertical; }
.hint { font-size: 12px; color: var(--text-3); margin-top: 6px; }
.shots { display: grid; gap: 10px; }
.shot { background: var(--surface-2); border-radius: 12px; overflow: hidden; }
.shot .cap { font-size: 12px; color: var(--text-2); padding: 6px 10px; }
.shot img { display: block; width: 100%; min-height: 120px; background: var(--surface-2); }
.viewer { position: fixed; inset: 0; z-index: 60; background: #000; overflow: hidden; display: flex; align-items: center; touch-action: none; }
.viewer img { width: 100%; height: auto; transform-origin: 0 0; will-change: transform; user-select: none; -webkit-user-drag: none; }
.viewer button { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: 12px; width: 40px; height: 40px; border-radius: 20px; background: rgba(255,255,255,.18); color: #fff; font-size: 22px; }

/* tab bar */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: center;
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
}
nav.tabs .in { display: flex; width: 100%; max-width: 760px; }
nav.tabs button { flex: 1; height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: var(--text-3); }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button.on { color: var(--accent); }

/* lock */
.lock { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
.lock .box { width: 100%; max-width: 360px; text-align: center; }
.lock h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -.02em; }
.lock p { color: var(--text-2); margin: 0 0 20px; font-size: 14px; }
.field { width: 100%; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 14px; font-size: 16px; }
.btn { width: 100%; height: 48px; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 600; margin-top: 10px; }
.btn.ghost { background: var(--surface); color: var(--text); border: 1px solid var(--line); }
.err { color: var(--bad); font-size: 13px; min-height: 18px; margin-top: 8px; }
.status { font-size: 12px; color: var(--text-3); text-align: center; padding: 4px 0 14px; }
.set-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.set-row:last-child { border-bottom: 0; }
.set-row span:first-child { color: var(--text-2); }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl td, .tbl th { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: right; }
.tbl th { color: var(--text-3); font-weight: 500; }
.tbl td:first-child, .tbl th:first-child { text-align: left; }
details summary { cursor: pointer; color: var(--text-2); font-size: 13px; margin-top: 12px; }

/* ============ computer: menu on the left, wide pages in columns, details in a side panel */
.brand { display: none; }
.cols-home, .grid2, .grid3 { display: block; }
@media (min-width: 960px) {
  body { padding-bottom: 0; padding-left: 232px; font-size: 14px; }
  .wrap { max-width: 1288px; }
  nav.tabs { top: 0; bottom: 0; right: auto; width: 232px; flex-direction: column; justify-content: flex-start; border-top: 0; border-right: 1px solid var(--line); padding: 18px 12px; background: var(--surface); }
  nav.tabs .in { flex-direction: column; gap: 2px; }
  nav.tabs button { flex: none; height: 42px; flex-direction: row; justify-content: flex-start; gap: 12px; padding: 0 14px; border-radius: 10px; font-size: 14px; color: var(--text-2); }
  nav.tabs button:hover { background: var(--surface-2); }
  nav.tabs button.on { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font-weight: 600; }
  nav.tabs button svg { width: 20px; height: 20px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: -.01em; padding: 4px 14px 22px; }
  .brand img { width: 28px; height: 28px; border-radius: 7px; }
  header { padding-top: 0; }
  header .wrap { display: flex; flex-wrap: wrap; align-items: center; column-gap: 14px; padding-top: 10px; }
  .hrow { flex-basis: 100%; height: 40px; }
  .title { font-size: 22px; }
  #periodBox { display: flex; align-items: center; gap: 14px; }
  .period, .nav { padding-bottom: 10px; }
  .seg { width: 400px; flex: none; }
  .nav { width: 300px; }
  .chips { padding-bottom: 10px; }
  #accChips { margin-top: 0 !important; }
  main { padding-top: 18px; padding-bottom: 32px; }
  .card { padding: 18px 20px; }
  .cols-home { display: grid; grid-template-columns: 400px 1fr; grid-template-areas: "today curve" "cal cal"; gap: 16px; }
  .a-today { grid-area: today; } .a-curve { grid-area: curve; } .a-cal { grid-area: cal; }
  .a-today > .card, .a-curve > .card { height: 100%; margin-bottom: 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; align-items: start; }
  .grid2 > .card, .grid3 > .card { margin-bottom: 0; }
  .grid2, .grid3 { margin-bottom: 12px; }
  .tiles { grid-template-columns: repeat(4, 1fr); }
  .hero .big { font-size: 52px; }
  .tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 0 16px; align-items: start; }
  .igrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 12px; background: none; border: 0; overflow: visible; }
  .igrid .item { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; align-items: flex-start; }
  .item:hover, .wd:hover, .cal .day:hover { filter: brightness(1.08); }
  .item:hover { background: var(--surface-2); }
  .cal { gap: 6px; grid-template-columns: repeat(7, 1fr) 72px; }
  .cal .day { aspect-ratio: 2 / 1; padding: 7px 9px; font-size: 12px; border-radius: 12px; }
  .cal .day .r { font-size: 16px; }
  .cal .day .n { font-size: 11px; }
  .cal .wk { font-size: 15px; }
  .cal .wk small { font-size: 11px; }
  .sheet-bg { background: rgba(0,0,0,.35); }
  .sheet { top: 0; left: auto; width: min(560px, 46vw); max-height: none; border-radius: 0; border-left: 1px solid var(--line); transform: translateX(100%); padding-bottom: 24px; }
  .sheet .grab { display: none; }
  .sheet .wrap { padding: 8px 20px; }
  .shots { grid-template-columns: 1fr; }
  .viewer { justify-content: center; }
  .viewer img { width: auto; max-width: 100%; max-height: 100vh; cursor: zoom-in; }
  .lock .box { max-width: 380px; }
}
</style>
</head>
<body>

<div id="lock" class="lock hidden">
  <div class="box">
    <h1>Alld Stats</h1>
    <p>Статистика сделок. Введи пароль — он нужен один раз на этом устройстве.</p>
    <form id="lockForm" autocomplete="off">
      <input id="pw" class="field" type="password" placeholder="Пароль" autocomplete="current-password">
      <button class="btn" type="submit" id="pwBtn">Открыть</button>
    </form>
    <div class="err" id="pwErr"></div>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="wrap">
      <div class="hrow">
        <div class="title" id="viewTitle">Обзор</div>
        <button class="icon-btn" id="setBtn" aria-label="Настройки">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
      <div id="periodBox">
        <div class="period"><div class="seg" id="modeSeg"></div></div>
        <div class="nav" id="navRow">
          <button class="icon-btn" id="prev" aria-label="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
          <div class="lbl" id="periodLbl"></div>
          <button class="icon-btn" id="next" aria-label="Вперёд"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
        </div>
      </div>
      <div class="chips" id="pairChips"></div>
      <div class="chips" id="accChips" style="margin-top:-4px"></div>
    </div>
  </header>
  <main class="wrap" id="view"></main>
  <nav class="tabs"><div class="brand"><img src="icon.png" alt="">Alld Stats</div><div class="in" id="tabs"></div></nav>
</div>

<div class="sheet-bg hidden" id="sheetBg"></div>

<script>
"use strict";
/* ============================================================ storage & crypto */
const APPV = "65543d56446a";
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const b64 = {
  enc(buf) { let s = ""; const a = new Uint8Array(buf); for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); },
  dec(str) { const s = atob(str); const a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; },

let KEY = null;
async function deriveKey(pw, meta) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64.dec(meta.salt), iterations: meta.iter }, base, 256);

}
async function importKey(raw) { return crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["encrypt", "decrypt"]); }

}
async function getBin(path, fresh) {
  const r = await fetch(path + (fresh ? "?t=" + Date.now() : ""), { cache: fresh ? "no-store" : "default" });
  if (!r.ok) throw new Error(path + " " + r.status);
  return r.arrayBuffer();
}

/* ============================================================ data */
let DATA = { trades: [], ideas: [] }, META = null, MARKS = LS.get("as_marks", {});
const S = Object.assign({ tab: "home", curve: "m", mode: "week", anchor: null, pair: "all", acc: "all", calSel: null, ideaF: "no" }, LS.get("as_ui", {}));
if (!["home", "stats", "trades", "ideas"].includes(S.tab)) S.tab = "home";
if (S.acc === "none") S.acc = "all";
function saveUi() { LS.set("as_ui", { tab: S.tab, mode: S.mode, pair: S.pair, acc: S.acc, ideaF: S.ideaF, curve: S.curve, unit: S.unit }); }

async function loadMeta(fresh) {
  const r = await fetch("meta.json?t=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error("meta " + r.status);
  return r.json();
}
async function loadData() {
  try {
    META = await loadMeta();
    LS.set("as_meta", META); repoFromMeta();
    if (META.app && META.app !== APPV && APPV !== "__APP" + "V__" && sessionStorage.getItem("as_rl") !== META.app) {
      sessionStorage.setItem("as_rl", META.app); location.reload(); return;
    }
    if (LS.get("as_h") !== META.h || !LS.get("as_data")) {
      const raw = await openBox(await getBin("d.bin", true));
      DATA = JSON.parse(new TextDecoder().decode(raw));
      LS.set("as_data", DATA); LS.set("as_h", META.h);
    } else DATA = LS.get("as_data", DATA);
    NET = true;
  } catch (e) {
    META = LS.get("as_meta", null); DATA = LS.get("as_data", DATA); NET = false; repoFromMeta();
  }
}
let NET = true;

/* marks («по системе»): local first, synced through GitHub API when a token is set */
let REPO = (() => {
  const m = location.hostname.match(/^([^.]+)\.github\.io$/);
  const p = location.pathname.split("/").filter(Boolean)[0];
  return m && p ? { owner: m[1], name: p } : null;
})();
function repoFromMeta() {  // the PC window is on 127.0.0.1: the repository for marks comes from meta.json
  if (!REPO && META && META.repo && META.repo.includes("/")) { const [owner, name] = META.repo.split("/"); REPO = { owner, name }; }
}
let SYNC = "";
async function remoteMarks() {
  const tok = LS.get("as_tok", "");
  if (REPO && tok) {
    const r = await fetch(`https://api.github.com/repos/${REPO.owner}/${REPO.name}/contents/m.bin?t=${Date.now()}`,
      { headers: { Authorization: "Bearer " + tok, Accept: "application/vnd.github+json" }, cache: "no-store" });
    if (r.status === 404) return { marks: {}, sha: null };
    if (!r.ok) throw new Error("GitHub " + r.status);
    const j = await r.json();
    const raw = await openBox(b64.dec(j.content.replace(/\s/g, "")).buffer);
    return { marks: JSON.parse(new TextDecoder().decode(raw)), sha: j.sha };
  }
  try { const raw = await openBox(await getBin("m.bin", true)); return { marks: JSON.parse(new TextDecoder().decode(raw)), sha: null }; }
  catch (e) { return { marks: {}, sha: null }; }
}
function mergeMarks(a, b) {
  const out = Object.assign({}, a);
  for (const k in b) if (!out[k] || (b[k].t || 0) > (out[k].t || 0)) out[k] = b[k];
  return out;
}
async function syncMarks(push) {
  try {
    const { marks, sha } = await remoteMarks();
    const merged = mergeMarks(marks, MARKS);
    const dirty = JSON.stringify(merged) !== JSON.stringify(marks);
    MARKS = merged; LS.set("as_marks", MARKS);
    const tok = LS.get("as_tok", "");
    if (push && dirty && REPO && tok) {
      const body = { message: "marks", content: b64.enc(await sealBox(new TextEncoder().encode(JSON.stringify(MARKS)))) };
      if (sha) body.sha = sha;
      const r = await fetch(`https://api.github.com/repos/${REPO.owner}/${REPO.name}/contents/m.bin`,
        { method: "PUT", headers: { Authorization: "Bearer " + tok, Accept: "application/vnd.github+json" }, body: JSON.stringify(body) });
      if (!r.ok) throw new Error("GitHub " + r.status);
      SYNC = "Отметки сохранены";
    } else SYNC = (REPO && tok) ? "Отметки синхронизированы" : (dirty ? "Отметки только на этом устройстве" : "");
  } catch (e) { SYNC = "Отметки не синхронизированы: " + e.message; }
}
function setMark(id, patch) {
  const cur = MARKS[id] || {};
  const m = Object.assign({}, cur, patch, { t: Date.now() });
  if (m.s == null && !m.n) m.del = 1; else delete m.del;
  MARKS[id] = m; LS.set("as_marks", MARKS);
  clearTimeout(setMark.tm); setMark.tm = setTimeout(() => syncMarks(true).then(render), 800);
}
function markOf(id) { const m = MARKS[id]; return m && !m.del ? m : null; }

/* ============================================================ helpers */
const MON = ["янв", "фев", "мар", "апр", "мая", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
const MONF = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
const DOW = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
const pd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const monday = d => addDays(d, -((d.getDay() + 6) % 7));
const dowIdx = s => (pd(s).getDay() + 6) % 7;
function fmtR(r, plain) {
  if (r == null) return "—";
  const v = Math.round(r * 10) / 10;
  if (Math.abs(v) < 0.05) return "0R";
  const s = (v > 0 ? "+" : "−") + String(Math.abs(v)).replace(/\.0$/, "") + "R";
  return s;
}
const cls = r => r == null ? "zero" : r > 0.04 ? "pos" : r < -0.04 ? "neg" : "zero";
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sideRu = s => s === "BUY" ? "Лонг" : "Шорт";
function session(t) {
  if (!t.time) return "нет времени";
  const m = +t.time.slice(0, 2) * 60 + +t.time.slice(3, 5);
  if (m >= 720 && m <= 870) return "Лондон";
  if (m >= 1020 && m <= 1200) return "Нью-Йорк";
  return "вне окна";
}
function duration(t) {
  if (!t.time || !t.ctime) return null;
  const a = pd(t.date); a.setHours(+t.time.slice(0, 2), +t.time.slice(3));
  const b = pd(t.cdate || t.date); b.setHours(+t.ctime.slice(0, 2), +t.ctime.slice(3));
  const min = Math.round((b - a) / 60000);
  if (min < 0) return null;
  if (min < 60) return min + " мин";
  const h = Math.floor(min / 60), mm = min % 60;
  if (h < 24) return h + " ч" + (mm ? " " + mm + " мин" : "");
  return Math.floor(h / 24) + " д " + (h % 24) + " ч";
}
const dLabel = s => { const d = pd(s); return `${d.getDate()} ${MON[d.getMonth()]}`; };
const dLong = s => { const d = pd(s); return `${DOW[(d.getDay() + 6) % 7]}, ${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`; };

/* ============================================================ period */
const MODES = [["day", "День"], ["week", "Неделя"], ["month", "Месяц"], ["year", "Год"], ["all", "Всё"]];
/* the chosen account sees its own R (its fill and stop); «Все счета» — R of the journal record */
let _tr = null, _trKey = "";
function TR() {
  const a = oneAcc(), key = (a || "") + "|" + DATA.trades.length + "|" + (META && META.h);
  if (_tr && _trKey === key) return _tr;
  _trKey = key;
  _tr = !a ? DATA.trades : DATA.trades.map(t => {
    const x = (t.accs || []).find(y => y.a === a);
    return x && x.r != null && x.r !== t.r ? Object.assign({}, t, { r: x.r, rj: t.r }) : t;
  });
  return _tr;
}
function lastDate() { const ts = DATA.trades; return ts.length ? ts[ts.length - 1].date : iso(new Date()); }
function anchor() { return S.anchor ? pd(S.anchor) : new Date(new Date().setHours(0, 0, 0, 0)); }
function range(mode, a) {
  if (mode === "day") return [iso(a), iso(a)];
  if (mode === "week") { const m = monday(a); return [iso(m), iso(addDays(m, 6))]; }
  if (mode === "month") return [iso(new Date(a.getFullYear(), a.getMonth(), 1)), iso(new Date(a.getFullYear(), a.getMonth() + 1, 0))];
  if (mode === "year") return [`${a.getFullYear()}-01-01`, `${a.getFullYear()}-12-31`];
  return ["0000-00-00", "9999-99-99"];
}
function shift(dir) {
  const a = anchor();
  if (S.mode === "day") a.setDate(a.getDate() + dir);
  if (S.mode === "week") a.setDate(a.getDate() + 7 * dir);
  if (S.mode === "month") { a.setDate(1); a.setMonth(a.getMonth() + dir); }
  if (S.mode === "year") a.setFullYear(a.getFullYear() + dir);
  S.anchor = iso(a); S.calSel = null; render();
}
function periodLabel(mode, a) {
  const [f, t] = range(mode, a);
  if (mode === "day") return dLong(f);
  if (mode === "week") { const A = pd(f), B = pd(t); return A.getMonth() === B.getMonth() ? `${A.getDate()}–${B.getDate()} ${MON[B.getMonth()]} ${B.getFullYear()}` : `${A.getDate()} ${MON[A.getMonth()]} – ${B.getDate()} ${MON[B.getMonth()]} ${B.getFullYear()}`; }
  if (mode === "month") return `${MONF[a.getMonth()]} ${a.getFullYear()}`;
  if (mode === "year") return String(a.getFullYear());
  return "Вся история";
}
function pairOk(t) {
  return (S.pair === "all" || t.pair === S.pair)
    && (S.acc === "all" || (t.accs || []).some(x => x.a === S.acc));
}
function accName(id) { const m = MARKS["_acc_" + id]; if (m && m.n) return m.n; const a = (DATA.accounts || []).find(x => x.id === id); return a ? a.name : id; }
/* % of the account: each trade has its own % per account (profit / balance before, from MT5 history).
   Period total = compounded, as the account really grew. Several accounts → one line each. */
const oneAcc = () => S.acc !== "all" && S.acc !== "none" ? S.acc : null;
function accPct(t, a) { const x = (t.accs || []).find(y => y.a === a); return x && x.pct != null ? x.pct : null; }
function pctSum(ts, a) { let g = 1, any = false; for (const t of ts) { const p = accPct(t, a); if (p != null) { g *= 1 + p / 100; any = true; } } return any ? (g - 1) * 100 : null; }
function fmtP(p) {
  if (p == null) return "—";
  const a = Math.abs(p); if (a < 0.005) return "0%";
  return (p > 0 ? "+" : "−") + (a >= 10 ? a.toFixed(1) : a.toFixed(2)).replace(/\.?0+$/, "") + "%";
}
function pctLine(ts, short) {
  const accs = oneAcc() ? [oneAcc()] : (DATA.accounts || []).map(a => a.id);
  const parts = accs.map(a => [a, pctSum(ts, a)]).filter(x => x[1] != null);
  if (!parts.length) return "";
  const abbr = n => (n.match(/[A-ZА-ЯЁ]/g) || [n[0]]).join("").slice(0, 3);
  return parts.map(([a, p]) => `${parts.length > 1 ? esc(short ? abbr(accName(a)) : accName(a)) + " " : ""}<span class="${cls(p)}">${fmtP(p)}</span>`).join(" · ");
}
function pctDD(ts, a) { let g = 1, peak = 1, dd = 0; for (const t of ts) { const p = accPct(t, a); if (p == null) continue; g *= 1 + p / 100; peak = Math.max(peak, g); dd = Math.max(dd, 1 - g / peak); } return dd * 100; }
function riskOf(t) {
  if (t.accs && t.accs.some(x => x.risk != null)) {
    const list = S.acc !== "all" && S.acc !== "none" ? t.accs.filter(x => x.a === S.acc) : t.accs;
    const r = list.filter(x => x.risk != null).map(x => (x.est ? "≈" : "") + x.risk + "%");
    return r.length ? r.join(" / ") : null;
  }
  return t.risk || null;
}
function inPeriod(mode, a) { const [f, t] = range(mode, a); return TR().filter(x => x.date >= f && x.date <= t && pairOk(x)); }

/* ============================================================ stats */
function stats(ts) {
  const done = ts.filter(t => t.r != null);
  const s = { n: done.length, open: ts.length - done.length, sum: 0, w: 0, l: 0, be: 0, gw: 0, gl: 0, best: null, worst: null, dd: 0, ws: 0, ls: 0 };
  let cum = 0, peak = 0, cw = 0, cl = 0;
  for (const t of done) {
    const r = t.r; s.sum += r; cum += r; peak = Math.max(peak, cum); s.dd = Math.max(s.dd, peak - cum);
    if (r > 0.04) { s.w++; s.gw += r; cw++; cl = 0; } else if (r < -0.04) { s.l++; s.gl += -r; cl++; cw = 0; } else { s.be++; cw = 0; cl = 0; }
    s.ws = Math.max(s.ws, cw); s.ls = Math.max(s.ls, cl);
    if (s.best == null || r > s.best) s.best = r;
    if (s.worst == null || r < s.worst) s.worst = r;
  }
  s.wr = s.n ? s.w / s.n : null;
  s.avgW = s.w ? s.gw / s.w : null; s.avgL = s.l ? -s.gl / s.l : null;
  s.pf = s.gl ? s.gw / s.gl : (s.gw ? Infinity : null);
  s.exp = s.n ? s.sum / s.n : null;
  return s;
}
const pct = v => v == null ? "—" : Math.round(v * 100) + "%";
const num = (v, d = 1) => v == null ? "—" : v === Infinity ? "∞" : (Math.round(v * 10 ** d) / 10 ** d).toFixed(d).replace(/\.0+$/, "");

/* ============================================================ charts (inline SVG) */
let TIPS = [];
function equityChart(ts, frac) {
  /* per trade: x = trade number */
  const done = ts.filter(t => t.r != null);
  if (done.length < 2) return "";
  let cum = 0;
  const pts = [{ x: 0, c: 0, tip: "Начало периода" }].concat(done.map((t, i) => {
    cum += t.r; return { x: (i + 1) / done.length, c: cum, tip: `<b>${fmtR(cum)}</b> всего<br>${dLabel(t.date)} · ${t.pair} · ${fmtR(t.r)}` };
  }));
  return curveChart(pts, frac, dLabel(done[0].date), dLabel(done[done.length - 1].date));
}
function smoothPath(P) {
  /* monotone cubic through the points: a smooth curve that never overshoots a day */
  const n = P.length;
  if (n < 3) return "M" + P.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join("L");
  const d = [], m = [];
  for (let i = 0; i < n - 1; i++) d[i] = (P[i + 1][1] - P[i][1]) / ((P[i + 1][0] - P[i][0]) || 1e-6);
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], h = a * a + b * b;
    if (h > 9) { const t = 3 / Math.sqrt(h); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i]; }
  }
  let out = `M${P[0][0].toFixed(1)} ${P[0][1].toFixed(1)}`;
  for (let i = 0; i < n - 1; i++) {
    const h = P[i + 1][0] - P[i][0];
    out += `C${(P[i][0] + h / 3).toFixed(1)} ${(P[i][1] + m[i] * h / 3).toFixed(1)} ${(P[i + 1][0] - h / 3).toFixed(1)} ${(P[i + 1][1] - m[i + 1] * h / 3).toFixed(1)} ${P[i + 1][0].toFixed(1)} ${P[i + 1][1].toFixed(1)}`;
  }
  return out;
}
function curveChart(pts, frac, left, right, H0, Wabs) {
  /* pts: [{x 0..1, c cumulative R, tip html}] */
  const id = "eq" + Math.random().toString(36).slice(2, 7);
  const W = Wabs ? Math.max(260, Wabs) : chartW(frac), H = H0 || (DESK() ? 240 : 200), pl = 34, pr = 10, pt = 12, pb = 22;
  const lo = Math.min(0, ...pts.map(p => p.c)), hi = Math.max(0, ...pts.map(p => p.c));
  const step = niceStep((hi - lo || 1) / 4);
  const y0 = Math.floor(lo / step) * step, y1 = Math.ceil(hi / step) * step || step;
  const X = x => pl + (W - pl - pr) * x, Y = v => pt + (H - pt - pb) * (1 - (v - y0) / (y1 - y0 || 1));
  let g = "";
  for (let v = y0; v <= y1 + 1e-9; v += step) g += `<line class="${Math.abs(v) < 1e-9 ? "zero-line" : "grid"}" x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axis" x="${pl - 6}" y="${Y(v) + 4}" text-anchor="end">${fmtR(v).replace("R", "")}</text>`;
  const P = pts.map(p => [X(p.x), Y(p.c)]);
  const d = smoothPath(P);
  const area = d + `L${P[P.length - 1][0].toFixed(1)} ${Y(0)}L${P[0][0].toFixed(1)} ${Y(0)}Z`;
  const last = pts[pts.length - 1].c, col = last >= 0 ? "--pos" : "--neg";
  const lbl = `<text class="axis" x="${pl}" y="${H - 4}">${esc(left)}</text><text class="axis" x="${W - pr}" y="${H - 4}" text-anchor="end">${esc(right)}</text>`;
  TIPS.push({ id, kind: "eq", pts, P, W, H });
  return `<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
    <defs><linearGradient id="g${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(${col})" stop-opacity=".28"/><stop offset="1" stop-color="var(${col})" stop-opacity="0"/></linearGradient></defs>
    ${g}<path d="${area}" fill="url(#g${id})"/><path d="${d}" fill="none" stroke="var(${col})" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${lbl}<line class="cross" opacity="0" stroke="var(--text-3)" stroke-width="1" y1="${pt}" y2="${H - pb}" x1="0" x2="0"/>
    <circle class="dot" opacity="0" r="4.5" cx="0" cy="0" fill="var(${col})" stroke="var(--surface)" stroke-width="2"/></svg><div class="tip"></div></div>`;
}
const DESK = () => matchMedia("(min-width: 960px)").matches;
function chartW(frac = 1) {
  const v = document.getElementById("view"), inner = Math.min((v.clientWidth || 375) - 32, DESK() ? 1256 : 728);
  return Math.max(260, (DESK() && frac < 1 ? (inner - 12) * frac : inner) - (DESK() ? 42 : 34));
}
function niceStep(x) { const p = 10 ** Math.floor(Math.log10(x || 1)); const f = x / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
function barsChart(buckets, frac) {
  /* buckets: [{label, r, n, tip}] — diverging bars from zero */
  if (!buckets.some(b => b.n)) return "";
  const id = "bc" + Math.random().toString(36).slice(2, 7);
  const W = chartW(frac), H = DESK() ? 240 : 170, pl = 34, pr = 6, pt = 10, pb = 22;
  const lo = Math.min(0, ...buckets.map(b => b.r)), hi = Math.max(0, ...buckets.map(b => b.r));
  const step = niceStep((hi - lo || 1) / 4), y0 = Math.floor(lo / step) * step, y1 = Math.ceil(hi / step) * step || step;
  const Y = v => pt + (H - pt - pb) * (1 - (v - y0) / (y1 - y0 || 1));

const resetViewer = (() => {
  const vw = document.getElementById("viewer"), img = document.getElementById("viewerImg");
  const pts = new Map();
  let s = 1, x = 0, y = 0, st = null, lastTap = 0;
  const apply = () => { img.style.transform = `translate(${x}px, ${y}px) scale(${s})`; };
  const clamp = () => {
    if (s <= 1) { s = 1; x = 0; y = 0; return; }
    const W = vw.clientWidth, H = vw.clientHeight, w = img.offsetWidth * s, h = img.offsetHeight * s, L = img.offsetLeft, T = img.offsetTop;
    x = Math.min(-L, Math.max(W - L - w, x));
    y = h <= H ? (H - h) / 2 - T : Math.min(-T, Math.max(H - T - h, y));
  };
  const snap = () => {
    const a = [...pts.values()];
    const c = a.length > 1 ? { x: (a[0].x + a[1].x) / 2, y: (a[0].y + a[1].y) / 2, d: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) } : { x: a[0].x, y: a[0].y, d: 0 };
    return Object.assign(c, { s, x0: x, y0: y });
  };
  vw.addEventListener("pointerdown", e => {
    if (e.target.closest("button")) return;
    vw.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); st = snap();
    if (pts.size === 1) {
      const now = Date.now();
      if (now - lastTap < 300) {  // double tap: zoom in at the finger / back out
        if (s > 1) s = 1; else { const q = { x: (e.clientX - img.offsetLeft - x) / s, y: (e.clientY - img.offsetTop - y) / s }; s = 2.5; x = e.clientX - img.offsetLeft - s * q.x; y = e.clientY - img.offsetTop - s * q.y; }
        clamp(); apply(); lastTap = 0; return;
      }
      lastTap = now;
    }
  });
  vw.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const c = snap();
    if (pts.size > 1 && st.d) {
      const ns = Math.min(6, Math.max(1, st.s * c.d / st.d));
      const qx = (st.x - img.offsetLeft - st.x0) / st.s, qy = (st.y - img.offsetTop - st.y0) / st.s;
      s = ns; x = c.x - img.offsetLeft - s * qx; y = c.y - img.offsetTop - s * qy;
    } else if (s > 1) { x = st.x0 + (c.x - st.x); y = st.y0 + (c.y - st.y); }
    clamp(); apply();
  });
  vw.addEventListener("wheel", e => {  // computer: wheel zooms at the cursor
    e.preventDefault();
    const ns = Math.min(6, Math.max(1, s * (e.deltaY < 0 ? 1.2 : 1 / 1.2)));
    const qx = (e.clientX - img.offsetLeft - x) / s, qy = (e.clientY - img.offsetTop - y) / s;
    s = ns; x = e.clientX - img.offsetLeft - s * qx; y = e.clientY - img.offsetTop - s * qy; clamp(); apply();
  }, { passive: false });
  window.addEventListener("keydown", e => { if (e.key === "Escape" && !vw.classList.contains("hidden")) closeViewer(); else if (e.key === "Escape") closeSheet(); });
  const up = e => { pts.delete(e.pointerId); if (pts.size) st = snap(); clamp(); apply(); };
  vw.addEventListener("pointerup", up); vw.addEventListener("pointercancel", up);
  return () => { pts.clear(); s = 1; x = 0; y = 0; apply(); };
})();

function shiftMonth(dir) { const a = anchor(); a.setDate(1); a.setMonth(a.getMonth() + dir); S.anchor = iso(a); S.calSel = null; render(); }
document.getElementById("setBtn").onclick = openSettings;

let rsz; window.addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(() => { if (KEY && !document.getElementById("app").classList.contains("hidden")) render(); }, 150); });
/* swipe left/right on the view = previous / next period */
(() => {
  let x0 = null, y0 = null;
  const v = document.getElementById("view");
  v.addEventListener("touchstart", e => { if (e.target.closest(".chart")) return; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  v.addEventListener("touchend", e => {
    if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > 2 * Math.abs(dy) && S.tab !== "ideas" && (S.tab === "home" || S.mode !== "all"))
      S.tab === "home" ? shiftMonth(dx < 0 ? 1 : -1) : shift(dx < 0 ? 1 : -1);
  }, { passive: true });
})();

/* ============================================================ start */
async function unlocked() {
  document.getElementById("lock").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  await loadData();
  render();
  await syncMarks(false); render();
}
document.getElementById("lockForm").onsubmit = async e => {
  e.preventDefault();
  const err = document.getElementById("pwErr"), btn = document.getElementById("pwBtn");
  err.textContent = ""; btn.textContent = "Проверяю…"; btn.disabled = true;
  try {
    const meta = await loadMeta();
    const raw = await deriveKey(document.getElementById("pw").value.trim(), meta);
    KEY = await importKey(raw);
    const d = await openBox(await getBin("d.bin", true));  // throws on a wrong password
    DATA = JSON.parse(new TextDecoder().decode(d));
    LS.set("as_key", b64.enc(raw)); LS.set("as_data", DATA); LS.set("as_h", meta.h); LS.set("as_meta", meta);
    await unlocked();
  } catch (x) {
    err.textContent = x && x.name === "OperationError" ? "Неверный пароль" : "Нет связи — попробуй ещё раз";
  } finally { btn.textContent = "Открыть"; btn.disabled = false; }
};
(async () => {
  applyTheme();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  const k = LS.get("as_key", null);
  if (k) { KEY = await importKey(b64.dec(k)); await unlocked(); }
  else document.getElementById("lock").classList.remove("hidden");
  document.addEventListener("visibilitychange", async () => { if (document.visibilityState === "visible" && KEY) { await loadData(); await syncMarks(false); if (sheet.classList.contains("hidden")) render(); } });
})();
</script>
